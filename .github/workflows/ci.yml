name: Workflow CI

on:
    pull_request:
        branches: [develop]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
    pre-commit:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
        - uses: pre-commit/action@v3.0.0

    lint:
        runs-on: ubuntu-latest
        needs: pre-commit
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Sync dependencies
              run: uv sync

            - name: Ruff - lint
              run: uv run ruff check .

            - name: Ruff - check formatting
              run: uv run ruff format --check .

    typecheck:
        runs-on: ubuntu-latest
        needs: pre-commit
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Sync dependencies
              run: uv sync

            - name: Mypy - type checking
              run: uv run mypy app/

    security:
        runs-on: ubuntu-latest
        needs: pre-commit
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Sync dependencies
              run: uv sync

            - name: Bandit - static analysis
              run: uv run bandit -r app/

            - name: Safety - dependencies vulnerabilities
              run: uv run safety check

    tests:
        runs-on: ubuntu-latest
        needs: pre-commit
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: test_db
                    POSTGRES_USER: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Sync dependencies
              run: uv sync

            - name: Run tests with coverage
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
              run: uv run pytest --cov=app --cov-report=term --cov-report=xml
    release:

      runs-on: ubuntu-latest
      needs: [lint, typecheck, security, tests]
      outputs:
        version: ${{ steps.get_version.outputs.version }}

      steps:
        # Étape 1: Génère un token d'authentification depuis une GitHub App
        - name: Generate App Token
          id: get_token  # ID pour référencer les outputs de cette étape
          uses: actions/create-github-app-token@v2  # Action officielle pour créer un token
          with:
            app-id: ${{ secrets.APP_ID }}           # ID de l'application (stocké dans les secrets)
            private-key: ${{ secrets.PRIVATE_KEY }} # Clé privée de l'app (stockée dans les secrets)

        - name: Checkout code
          uses: actions/checkout@v6

        - name: Set up uv
          uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

        - name: Install dependencies
          run: uv sync

        # Étape 4: Installe Python Semantic Release comme outil
        - name: Install Python Semantic Release
          run: |
            # uv tool install : Installe un outil Python en isolation
            # python-semantic-release : Outil pour versionning sémantique automatique
            uv tool install python-semantic-release

        - name: Configure Git to use App Token
          run: |
              git remote set-url origin https://x-access-token:${{ steps.get_token.outputs.token }}@github.com/${{ github.repository }}.git

          # Étape 5: Génère une nouvelle version et publie la release
        - name: Semantic Versioning
          id: semantic
          env:
            # Token nécessaire pour créer des releases sur GitHub
            GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
            GH_TOKEN: ${{ steps.get_token.outputs.token }}
          run: |
            # Configure l'identité Git pour les commits automatiques
            git config user.name "victor-four[bot]"
            git config user.email "victor-four[bot]@users.noreply.github.com"

            # uv run : Exécute la commande dans l'environnement de l'outil installé
            # version --changelog : Détermine la nouvelle version et met à jour le changelog
            uv run semantic-release version --changelog

            # publish : Crée le tag Git et la release GitHub (uniquement sur main)
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "📦 Creating GitHub Release (main branch)"
              uv run semantic-release publish
            else
              echo "⏭️ Skipping GitHub Release (develop branch - pre-release only)"
              # Sur develop, on push juste le tag Git sans créer de GitHub Release
              git push --follow-tags origin HEAD
            fi

        # Étape 6: Récupère la version créée pour l'exposer aux autres jobs
        - name: Get Version
          id: get_version
          run: |
            # Récupère le dernier tag Git (qui correspond à la version créée)
            VERSION=$(git describe --tags --abbrev=0)
            # Exporte la version dans les outputs du job
            echo "version=$VERSION" >> $GITHUB_OUTPUT

    build:
        runs-on: ubuntu-latest

        needs: release

        steps:
          # Build and push Docker image
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Extract metadata
            id: meta
            uses: docker/metadata-action@v5
            with:
              images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              tags: |
                type=raw,value=${{ needs.release.outputs.version }}

          - name: Build and push Docker image
            uses: docker/build-push-action@v5
            with:
              context: .
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
