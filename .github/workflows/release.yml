name: Semantic Release
#Add fluff to create newrelease
on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      # Étape 1: Génère un token d'authentification depuis une GitHub App
      - name: Generate App Token
        id: get_token  # ID pour référencer les outputs de cette étape
        uses: actions/create-github-app-token@v2  # Action officielle pour créer un token
        with:
          app-id: ${{ secrets.APP_ID }}           # ID de l'application (stocké dans les secrets)
          private-key: ${{ secrets.PRIVATE_KEY }} # Clé privée de l'app (stockée dans les secrets)

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      # Étape 4: Installe Python Semantic Release comme outil
      - name: Install Python Semantic Release
        run: |
          # uv tool install : Installe un outil Python en isolation
          # python-semantic-release : Outil pour versionning sémantique automatique
          uv tool install python-semantic-release

      - name: Configure Git to use App Token
        run: |
            git remote set-url origin https://x-access-token:${{ steps.get_token.outputs.token }}@github.com/${{ github.repository }}.git

        # Étape 5: Génère une nouvelle version et publie la release
      - name: Semantic Versioning
        id: semantic
        env:
          # Token nécessaire pour créer des releases sur GitHub
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          # Configure l'identité Git pour les commits automatiques
          git config user.name "victor-four[bot]"
          git config user.email "victor-four[bot]@users.noreply.github.com"

          # uv run : Exécute la commande dans l'environnement de l'outil installé
          # version --changelog : Détermine la nouvelle version et met à jour le changelog
          uv run semantic-release version --changelog

          # publish : Crée le tag Git et la release GitHub (uniquement sur main)
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "📦 Creating GitHub Release (main branch)"
            uv run semantic-release publish
          else
            echo "⏭️ Skipping GitHub Release (develop branch - pre-release only)"
            # Sur develop, on push juste le tag Git sans créer de GitHub Release
            git push --follow-tags origin HEAD
          fi

      # Étape 6: Récupère la version créée pour l'exposer aux autres jobs
      - name: Get Version
        id: get_version
        run: |
          # Récupère le dernier tag Git (qui correspond à la version créée)
          VERSION=$(git describe --tags --abbrev=0)
          # Exporte la version dans les outputs du job
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest

    needs: release

    steps:
      # Build and push Docker image
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
